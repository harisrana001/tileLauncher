<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#bgGrad)" />

  <!-- Metro Tiles Matrix -->
  <!-- Teal Tile -->
  <rect x="74" y="74" width="150" height="150" rx="12" fill="#00ABA9" filter="url(#softShadow)" />

  <!-- Cyan Tile -->
  <rect x="274" y="74" width="164" height="64" rx="10" fill="#1BA1E2" filter="url(#softShadow)" />

  <!-- Lime Tile -->
  <rect x="274" y="174" width="164" height="164" rx="12" fill="#A4C400" filter="url(#softShadow)" />

  <!-- Magenta Tile -->
  <rect x="74" y="260" width="150" height="178" rx="12" fill="#D80073" filter="url(#softShadow)" />

  <!-- Orange Tile -->
  <rect x="274" y="374" width="164" height="64" rx="10" fill="#FA6800" filter="url(#softShadow)" />
</svg>
